name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.PROJECT_NAME }}

      - name: Encode service account key
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          echo "GCP_SA_KEY_BASE64=$(printf '%s' "$GCP_SA_KEY" | base64 -w 0)" >> $GITHUB_ENV

      - name: Authorize Docker push
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      - name: Ensure Artifact Registry repository
        run: |
          gcloud artifacts repositories describe ga4-gsc-unified \
            --location=asia-northeast1 \
            --project=${{ secrets.PROJECT_NAME }} \
          || gcloud artifacts repositories create ga4-gsc-unified \
            --repository-format=docker \
            --location=asia-northeast1 \
            --project=${{ secrets.PROJECT_NAME }} \
            --description="ga4-gsc-unified container images"

      - name: Build and push Docker image
        run: |
          IMAGE=asia-northeast1-docker.pkg.dev/${{ secrets.PROJECT_NAME }}/ga4-gsc-unified/app
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ga4-gsc-unified
          image: asia-northeast1-docker.pkg.dev/${{ secrets.PROJECT_NAME }}/ga4-gsc-unified/app:${{ github.sha }}
          region: asia-northeast1
          flags: --platform=managed --allow-unauthenticated
          env_vars: |
            GCP_SA_KEY_BASE64=${{ env.GCP_SA_KEY_BASE64 }}
            PROJECT_NAME=${{ secrets.PROJECT_NAME }}

      - name: Show Output
        run: echo "${{ steps.deploy.outputs.url }}"
