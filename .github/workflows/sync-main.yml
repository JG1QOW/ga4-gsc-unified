name: Sync main to another repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-main-to-${{ vars.SYNC_TARGET_REPOSITORY }}
  cancel-in-progress: true

jobs:
  sync:
    name: Mirror main branch
    runs-on: ubuntu-latest
    env:
      TARGET_REPOSITORY: ${{ vars.SYNC_TARGET_REPOSITORY }}
      SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
    steps:
      - name: Validate configuration
        shell: bash
        run: |
          if [[ ! "$TARGET_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Set SYNC_TARGET_REPOSITORY to the target repository in owner/repository format."
            exit 1
          fi
          if [[ -z "$SYNC_TOKEN" ]]; then
            echo "::error::Set the SYNC_TOKEN repository secret."
            exit 1
          fi

      - name: Check out the complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror main to the target repository
        shell: bash
        run: |
          git remote add sync-target "https://x-access-token:${SYNC_TOKEN}@github.com/${TARGET_REPOSITORY}.git"
          git push --force sync-target HEAD:refs/heads/main
